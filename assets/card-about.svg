<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260">
  <defs>
    <style>
      .title   { fill:#BEF5A0; font-family:Consolas,monospace; font-weight:700; font-size:12px; letter-spacing:1.5px; }
      .greet   { fill:#BEF5A0; font-family:Consolas,monospace; font-size:11px; }
      .name    { fill:#F2F7F0; font-family:'Segoe UI',system-ui,sans-serif; font-weight:800; font-size:28px; letter-spacing:-0.03em; }
      .name-ac { fill:#86FF3D; font-family:'Segoe UI',system-ui,sans-serif; font-weight:800; font-size:28px; letter-spacing:-0.03em; }
      .role    { fill:#86FF3D; font-family:Consolas,monospace; font-size:12px; }
      .bio     { fill:#F2F7F0; font-family:'Segoe UI',system-ui,sans-serif; font-size:12.5px; }
      .bio-hl  { fill:#BEF5A0; font-family:'Segoe UI',system-ui,sans-serif; font-size:12.5px; font-weight:600; }
      .meta    { fill:#8B9885; font-family:Consolas,monospace; font-size:10px; }
    </style>
    <radialGradient id="cornerGlow">
      <stop offset="0%" stop-color="#37F21B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#37F21B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="640" height="260" rx="20" fill="#1A2E1A"/>
  <rect x="0" y="0" width="640" height="260" rx="20" fill="none" stroke="#86FF3D" stroke-opacity="0.3"/>

  <circle cx="90" cy="60" r="140" fill="url(#cornerGlow)"/>

  <text x="30" y="44" class="title">▸ SOBRE MIM</text>
  <line x1="30" y1="56" x2="610" y2="56" stroke="#86FF3D" stroke-opacity="0.2"/>

  <text x="30" y="98" class="greet">// Olá, visitante 👋</text>

  <text x="30" y="142" class="name">Jonathan </text>
  <text x="152" y="142" class="name-ac">Matos</text>

  <text x="30" y="168" class="role">Desenvolvedor Front-End · Júnior</text>

  <text x="30" y="198" class="bio">Construo </text>
  <text x="97" y="198" class="bio-hl">interfaces web modernas</text>
  <text x="30" y="216" class="bio">Apaixonado por </text>
  <text x="150" y="216" class="bio-hl">estética cyberpunk</text>
  <text x="270" y="216" class="bio">e código limpo.</text>

  <line x1="30" y1="232" x2="610" y2="232" stroke="#86FF3D" stroke-opacity="0.15"/>

  <text x="30" y="252" class="meta">◉ Brasil</text>
  <text x="120" y="252" class="meta">◉ Disponível para CLT</text>
  <text x="380" y="252" class="meta">◉ Cursando Ciência da Computação</text>
</svg>
